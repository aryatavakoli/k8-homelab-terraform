# values.yaml for cilium Helm chart
#https://istio.io/latest/docs/ambient/install/platform-prerequisites/#cilium
cni:
 exclusive: false

# https://docs.cilium.io/en/latest/network/servicemesh/istio/
socketLB: 
  hostNamespaceOnly: true

# https://www.talos.dev/v1.10/kubernetes-guides/network/deploying-cilium/
ipam:
  mode: kubernetes

kubeProxyReplacement: true

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

k8sServiceHost: localhost
k8sServicePort: 7445

gatewayAPI:
  enabled: false
  enableAlpn: false
  enableAppProtocol: false

l2announcements:
  enabled: true

externalIPs:
  enabled: true